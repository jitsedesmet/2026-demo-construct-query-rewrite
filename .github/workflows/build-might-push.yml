name: Build might push image

on:
  workflow_call:
    inputs:
      push:
        required: true
        type: boolean


# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  repo: "ghcr.io/jitsedesmet/demo-construct-query-rewrite"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Uses the `docker/login-action` action to log in to the Container registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `database.dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see "[Usage](https://github.com/docker/build-push-action#usage)" in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: Build and push webapp Docker image
        uses: docker/build-push-action@v6.5.0
        if: ${{ inputs.push == true }}
        with:
          context: .
          push: true
          tags: ${{ env.repo }}:latest
          file: Dockerfile
          cache-from: type=registry,ref=${{ env.repo }}:buildcache
          cache-to: type=registry,ref=${{ env.repo }}:buildcache,mode=max

      - name: Build image
        uses: docker/build-push-action@v6.5.0
        if: ${{ inputs.push != true }}
        with:
          context: .
          file: Dockerfile
          cache-from: type=registry,ref=${{ env.repo }}:buildcache
